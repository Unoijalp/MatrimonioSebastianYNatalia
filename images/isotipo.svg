<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&amp;display=swap');
      .mono { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; }
    </style>
  </defs>

  <!-- fondo -->
  <circle cx="200" cy="200" r="196" fill="#4a0f20"/>

  <!-- anillo doble -->
  <circle cx="200" cy="200" r="175" fill="none" stroke="#c9a24b" stroke-width="3"/>
  <circle cx="200" cy="200" r="163" fill="none" stroke="#c9a24b" stroke-width="0.75" opacity="0.6"/>

  <!-- floritura superior, simplificada y mas gruesa para visibilidad pequeña -->
  <g stroke="#c9a24b" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M200,118 L200,78"/>
    <path d="M200,104 C188,100 180,90 172,80"/>
    <path d="M200,104 C212,100 220,90 228,80"/>
  </g>
  <circle cx="200" cy="78" r="4" fill="#c9a24b"/>
  <circle cx="172" cy="80" r="2.5" fill="#c9a24b"/>
  <circle cx="228" cy="80" r="2.5" fill="#c9a24b"/>

  <!-- floritura inferior (espejo) -->
  <g stroke="#c9a24b" stroke-width="1.6" fill="none" stroke-linecap="round" transform="translate(0,400) scale(1,-1)">
    <path d="M200,118 L200,78"/>
    <path d="M200,104 C188,100 180,90 172,80"/>
    <path d="M200,104 C212,100 220,90 228,80"/>
  </g>
  <circle cx="200" cy="322" r="4" fill="#c9a24b"/>
  <circle cx="172" cy="320" r="2.5" fill="#c9a24b"/>
  <circle cx="228" cy="320" r="2.5" fill="#c9a24b"/>

  <!-- monograma, grande y en negrita para legibilidad pequeña -->
  <text class="mono" x="195" y="246" font-size="132" text-anchor="end" fill="#e8d9b5">S</text>
  <text class="mono" x="205" y="246" font-size="132" text-anchor="start" fill="#e8d9b5">N</text>
  <circle cx="200" cy="204" r="5.5" fill="#c9a24b"/>
</svg>
